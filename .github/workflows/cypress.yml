name: Cypress Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    
jobs:
  cypress-run:
    runs-on: ubuntu-latest
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start server
        run: npx live-server
        working-directory: ./site
        
      - name: Run Tests
        uses: cypress-io/github-action@v6.5.0
        with:
          working-directory: ./tests
          wait-on: 'http://localhost:3000'
